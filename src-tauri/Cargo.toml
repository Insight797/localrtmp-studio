[package]
name = "localrtmp-studio"
version = "0.1.0"
description = "Mac 本地 RTMP 服务器控制台（MediaMTX 内核）"
authors = ["Insight797"]
license = "MIT"
repository = "https://github.com/Insight797/localrtmp-studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
