name: Release

# 打 tag（例如 v0.1.0）即自动构建 macOS .app / .dmg 并发布到 GitHub Releases。
# 也可以手动触发（Actions 页面 → Release → Run workflow），产物作为 artifact 保留。
#
# 只构建 Apple Silicon：GitHub 的 Intel macOS runner 已退役，排不到机器。
# 需要 Intel 包时，在 Intel Mac 上执行 `npm ci && npm run app:build`。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: aarch64-apple-darwin
  LABEL: apple-silicon

jobs:
  build-macos:
    name: macOS (${{ env.LABEL }})
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安装构建依赖
        run: brew install mediamtx ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 npm 依赖
        run: npm ci

      # 把 node / mediamtx / ffmpeg 复制进 vendor/，由 tauri 打进 .app
      - name: 准备随包运行时
        run: node scripts/prepare-bundle.js

      - name: 构建 .app 与 .dmg
        run: npx tauri build --target ${{ env.TARGET }} --bundles app,dmg

      - name: ad-hoc 签名
        run: codesign --force --deep --sign - "src-tauri/target/${{ env.TARGET }}/release/bundle/macos/LocalRTMP Studio.app"

      - name: 整理产物
        run: |
          mkdir -p dist
          B="src-tauri/target/${{ env.TARGET }}/release/bundle"
          cp -R "$B/macos/LocalRTMP Studio.app" "dist/LocalRTMP Studio-${{ env.LABEL }}.app"
          (cd dist && zip -qry "LocalRTMP Studio-${{ env.LABEL }}.app.zip" "LocalRTMP Studio-${{ env.LABEL }}.app" && rm -rf "LocalRTMP Studio-${{ env.LABEL }}.app")
          cp "$B"/dmg/*.dmg "dist/LocalRTMP Studio-${{ env.LABEL }}.dmg"
          ls -lh dist

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            仅 Apple Silicon（arm64）。未做 Apple 开发者签名（只有 ad-hoc），
            首次打开被 Gatekeeper 拦时：右键图标 → 打开，或执行
            `xattr -dr com.apple.quarantine "/Applications/LocalRTMP Studio.app"`。

      - name: 保留构建产物（非 tag 触发）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: localrtmp-studio-${{ env.LABEL }}
          path: dist/*
