name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 语法与 Rust 检查
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      # tauri-build 会校验 bundle.resources，vendor/ 是打包时生成的、不入库
      - name: 占位随包运行时目录
        run: mkdir -p vendor

      - name: 检查 JS 语法
        run: |
          for f in server/index.js server/lib/*.js scripts/*.js ui/app.js; do
            node --check "$f"
          done

      - name: 检查 Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
